<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cousalacous — Watchlist</title>
<style>
  :root{--bg:#0d0e12;--panel:#16181f;--panel2:#1d2029;--txt:#e8eaf0;--dim:#9aa0ad;--acc:#00e054;--line:#262a35}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(13,14,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  h1{font-size:20px;letter-spacing:.5px}
  h1 span{color:var(--acc)}
  #count{color:var(--dim);font-size:13px;margin-left:8px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;outline:none}
  input[type=search]{flex:1;min-width:180px}
  input[type=search]:focus,select:focus{border-color:var(--acc)}
  #chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 0}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;user-select:none}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#06240f;font-weight:600}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:18px 20px 60px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease}
  .card:hover{transform:translateY(-4px);border-color:#3a4152}
  .poster{position:relative;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:700;font-size:26px;color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
  .poster img.ok{opacity:1}
  .meta{padding:10px 12px 12px}
  .meta h3{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .meta .y{color:var(--dim);font-size:12px;margin-top:3px}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tag{font-size:10px;letter-spacing:.4px;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:2px 7px;border-radius:999px}
  #modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:20px}
  #modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;display:flex;gap:18px;padding:18px;position:relative}
  .box .poster{width:200px;flex:0 0 200px;border-radius:10px}
  .box h2{font-size:20px;margin-bottom:4px}
  .box .info .y{color:var(--dim);margin-bottom:10px}
  .box p{color:#c6cbd6;font-size:14px;margin:12px 0}
  .lb{display:inline-block;background:var(--acc);color:#06240f;font-weight:700;font-size:13px;padding:8px 16px;border-radius:8px;text-decoration:none;margin-top:6px}
  #x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--dim);font-size:26px;cursor:pointer}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:0 20px 40px}
  @media(max-width:560px){.box{flex-direction:column}.box .poster{width:100%;flex:none;aspect-ratio:2/3}}
  body.compact #grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;padding:14px 16px 50px}
  body.compact .meta{padding:7px 9px 9px}
  body.compact .meta h3{font-size:11.5px}
  body.compact .meta .y{font-size:10.5px;margin-top:2px}
  body.compact .tags{gap:3px;margin-top:5px}
  body.compact .tag{font-size:8.5px;padding:1px 6px}
  body.compact .ph{font-size:20px}
  #fab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#06240f;font-size:30px;font-weight:700;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:40}
  #addM{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:20px}
  #addM.open{display:flex}
  .abox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:380px}
  .abox h3{margin-bottom:12px}
  .abox input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:15px;margin-bottom:10px;outline:none}
  .abox input:focus{border-color:var(--acc)}
  .arow{display:flex;gap:10px;margin-top:4px}
  .arow button{flex:1;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
  #aGo{background:var(--acc);color:#06240f}
  #aNo{background:var(--panel2);color:var(--dim)}
  #aErr{color:#ff6b6b;font-size:13px;min-height:1.2em;margin-top:8px}
  #cfgb{display:none;background:#2a2110;border:1px solid #6b5518;color:#e8c56b;font-size:13px;padding:10px 20px}
  .rm{display:inline-block;background:none;border:1px solid #5a2b2b;color:#ff8585;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;margin-top:10px;margin-left:8px}
</style>
<base target="_blank">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlist">

</head>
<body>
<header>
  <h1><span>&#9654;</span> cousalacous watchlist <span id="count"></span></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Search titles…">
    <select id="sort">
      <option value="title">Title A–Z</option>
      <option value="new">Year: newest first</option>
      <option value="old">Year: oldest first</option>
      <option value="added">Recently added</option>
    </select>
    <select id="size" title="Card size">
      <option value="large">Big cards</option>
      <option value="compact">Small cards</option>
    </select>
  </div>
</header>
<div id="cfgb"></div>
<div id="chips"></div>
<main id="grid"></main>
<footer>Posters stream from Wikipedia as you scroll (internet required). Blurbs &amp; filters work offline.</footer>
<button id="fab" title="Add a movie">+</button>
<div id="addM"><div class="abox"><h3>Add a movie</h3><input id="aT" placeholder="Title" autocomplete="off"><input id="aY" placeholder="Year (optional)" inputmode="numeric"><div class="arow"><button id="aGo">Add to watchlist</button><button id="aNo">Cancel</button></div><div id="aErr"></div></div></div>
<div id="modal"><div class="box"><button id="x">&times;</button><div class="poster" id="mPoster"></div><div class="info"><h2 id="mTitle"></h2><div class="y" id="mYear"></div><div class="tags" id="mTags"></div><p id="mBlurb"></p><a class="lb" id="mLb" target="_blank" rel="noopener">Open on Letterboxd &#8599;</a><button class="rm" id="mRm">Remove from watchlist</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="posters.js"></script>
<script src="seed.js"></script>
<script>
// movies now load from Firebase; row shape: [title, year, wiki, [genres], blurb, letterboxd, date, poster]
let M=[];

const grid=document.getElementById('grid'),chipsEl=document.getElementById('chips'),q=document.getElementById('q'),sortSel=document.getElementById('sort');
let activeGenres=new Set();
const genres=[...new Set(M.flatMap(m=>m[3]))].sort();
const art=t=>t.replace(/^(the|a|an)\s+/i,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};

function initChips(){
  chipsEl.innerHTML='';
  const all=document.createElement('span');all.className='chip on';all.textContent='All';all.onclick=()=>{activeGenres.clear();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));all.classList.add('on');render()};
  chipsEl.appendChild(all);
  genres.forEach(g=>{
    const c=document.createElement('span');c.className='chip';c.textContent=g;
    c.onclick=()=>{if(activeGenres.has(g)){activeGenres.delete(g);c.classList.remove('on')}else{activeGenres.add(g);c.classList.add('on');all.classList.remove('on')}if(!activeGenres.size)all.classList.add('on');render()};
    chipsEl.appendChild(c);
  });
}
function visible(){
  const term=q.value.trim().toLowerCase();
  return M.filter(m=>(!term||m[0].toLowerCase().includes(term))&&(!activeGenres.size||m[3].some(g=>activeGenres.has(g))));
}
function sorted(list){
  const s=sortSel.value;
  if(s==='title')return [...list].sort((a,b)=>art(a[0]).localeCompare(art(b[0])));
  if(s==='new')return [...list].sort((a,b)=>(b[1]||0)-(a[1]||0));
  if(s==='old')return [...list].sort((a,b)=>(a[1]||0)-(b[1]||0));
  return [...list].sort((a,b)=>b[6].localeCompare(a[6]));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){io.unobserve(e.target);loadPoster(e.target.dataset.i,e.target.querySelector('img'))}
}),{rootMargin:'400px'});
async function loadPoster(i,img){
  const m=M[i];
  if(m[7]){img.onload=()=>img.classList.add('ok');img.src=m[7];return;}
  const cand=[];
  if(m[2])cand.push(m[2]);
  else cand.push(m[0]+' (film)',m[0]+' ('+m[1]+' film)',m[0]);
  for(const w of cand){
    try{
      const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w));
      if(!r.ok)continue;
      const j=await r.json();
      const u=j.thumbnail?.source||j.originalimage?.source;
      if(!u)continue;
      img.onload=()=>img.classList.add('ok');
      img.src=u;
      return;
    }catch(e){/* try next candidate */}
  }
}
function render(){
  const list=sorted(visible());
  document.getElementById('count').textContent='· '+list.length+' of '+M.length+' titles';
  grid.innerHTML='';
  list.forEach(m=>{
    const i=M.indexOf(m);
    const card=document.createElement('div');card.className='card';card.dataset.i=i;
    const initials=m[0].split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    card.innerHTML=`<div class="poster" style="background:linear-gradient(145deg,hsl(${hue(m[0])} 45% 30%),hsl(${(hue(m[0])+50)%360} 55% 14%))"><div class="ph">${initials}</div><img alt="" loading="lazy"></div><div class="meta"><h3>${esc(m[0])}</h3><div class="y">${m[1]}</div><div class="tags">${m[3].map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div></div>`;
    card.onclick=()=>openModal(i,card);
    grid.appendChild(card);
    io.observe(card);
  });
}
const modal=document.getElementById('modal');
function openModal(i,card){
  const m=M[i];
  document.getElementById('mTitle').textContent=m[0];
  document.getElementById('mYear').textContent=(m[1]?m[1]+' · ':'')+(m[6]?'added '+m[6]:'');
  document.getElementById('mTags').innerHTML=m[3].map(g=>`<span class="tag">${esc(g)}</span>`).join('');
  document.getElementById('mBlurb').textContent=m[4]||'No synopsis available yet.';
  document.getElementById('mLb').href=m[5].includes('/')?m[5]:'https://boxd.it/'+m[5];
  const mRm=document.getElementById('mRm');
  if(DB){mRm.style.display='inline-block';mRm.onclick=()=>{if(m.k)DB.ref('movies/'+m.k).remove();modal.classList.remove('open');};}
  else mRm.style.display='none';
  const mp=document.getElementById('mPoster');
  const img=card.querySelector('img');
  mp.innerHTML='';
  if(img&&img.classList.contains('ok')){const c=img.cloneNode();c.className='ok';mp.appendChild(c)}
  else{const initials=m[0].split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();mp.innerHTML=`<div class="ph">${initials}</div>`;mp.style.background=`linear-gradient(145deg,hsl(${hue(m[0])} 45% 30%),hsl(${(hue(m[0])+50)%360} 55% 14%))`;loadPoster(i, Object.assign(mp.appendChild(document.createElement('img')),{}))}
  modal.classList.add('open');
}
document.getElementById('x').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
q.oninput=render;sortSel.onchange=render;
const sizeSel=document.getElementById('size');
function applyDensity(v){document.body.classList.toggle('compact',v==='compact');sizeSel.value=v;try{localStorage.setItem('wl-density',v)}catch(e){}}
sizeSel.onchange=()=>applyDensity(sizeSel.value);
let savedDensity=null;try{savedDensity=localStorage.getItem('wl-density')}catch(e){}
applyDensity(savedDensity||(matchMedia('(max-width:640px)').matches?'compact':'large'));
let DB=null;
const cfgb=document.getElementById('cfgb');
function setBanner(msg){cfgb.textContent=msg;cfgb.style.display=msg?'block':'none';}
function mergePoster(r){const k=r[0]+'|'+r[1];if(EMBED[k])r[7]=EMBED[k];return r;}
function applySnap(v){
  const rows=[];
  for(const k in v){const n=v[k];const r=[n.t,n.y,n.w||'',n.g||[],n.b||'',n.l||'',n.d||'',''];r.k=k;rows.push(r);}
  M=rows.map(mergePoster);
  try{localStorage.setItem('wl-cache',JSON.stringify(M.map(r=>({t:r[0],y:r[1],w:r[2],g:r[3],b:r[4],l:r[5],d:r[6]}))));}catch(e){}
  initChips();render();
}
function loadLocal(){
  try{
    const s=localStorage.getItem('wl-cache');if(!s)return false;
    const rows=JSON.parse(s).map(n=>{const r=[n.t,n.y,n.w||'',n.g||[],n.b||'',n.l||'',n.d||'',''];return mergePoster(r);});
    if(!rows.length)return false;
    M=rows;initChips();render();return true;
  }catch(e){return false;}
}
function seedIfRequested(){
  if(!/seed/.test(location.search))return;
  DB.ref('movies').once('value',s=>{
    const v=s.val();
    if(v&&Object.keys(v).length){setBanner('Database already seeded — skipped ('+Object.keys(v).length+' movies).');return;}
    const u={};SEED.forEach(n=>{u[DB.ref('movies').push().key]=n;});
    DB.ref('movies').update(u).then(()=>setBanner('Seeded '+SEED.length+' movies! You can drop ?seed=1 from the URL now.'));
  });
}
const fab=document.getElementById('fab'),addM=document.getElementById('addM'),
      aT=document.getElementById('aT'),aY=document.getElementById('aY'),
      aGo=document.getElementById('aGo'),aNo=document.getElementById('aNo'),aErr=document.getElementById('aErr');
function aClose(){addM.classList.remove('open');}
fab.onclick=()=>{addM.classList.add('open');aT.focus();};
aNo.onclick=aClose;
addM.onclick=e=>{if(e.target===addM)aClose();};
aGo.onclick=()=>{
  const t=aT.value.trim();
  if(!t){aErr.textContent='A title is required.';return;}
  const y=parseInt(aY.value,10)||'';
  DB.ref('movies').push({t:t,y:y,w:'',g:[],b:'',l:'',d:new Date().toISOString().slice(0,10)});
  aT.value='';aY.value='';aErr.textContent='';aClose();
};
initChips();
if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=='PASTE_API_KEY_HERE'){
  firebase.initializeApp(FIREBASE_CONFIG);
  DB=firebase.database();
  fab.style.display='flex';
  DB.ref('movies').on('value',s=>{setBanner('');applySnap(s.val()||{});},()=>{
    if(!loadLocal())render();
    setBanner('Could not reach the database — showing the last saved copy.');
  });
  seedIfRequested();
}else{
  if(!loadLocal())render();
  setBanner('Database not connected yet — paste your Firebase config into config.js to enable shared adding. Showing last saved copy.');
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
